<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Payment successful</title>
  </head>
  <body>
    <p>Payment successful. Redirecting…</p>

    <script>
      const params = new URLSearchParams(window.location.search);
      const sessionId = params.get("session_id");

      if (!sessionId) {
        document.body.innerText = "Missing session ID.";
      } else {
        window.location.href = `/redirect-after-success?session_id=${sessionId}`;
      }
    </script>
  </body>
</html>
