<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Payment Successful</title>
</head>
<body>
  <h1>Thanks for your purchase 🎉</h1>
  <p>Verifying your payment…</p>

  <script>
    const params = new URLSearchParams(window.location.search);
    const sessionId = params.get("session_id");

    if (!sessionId) {
      document.body.innerHTML = "<p>Missing session information.</p>";
      throw new Error("No session_id");
    }

    fetch(`/redirect-after-success?session_id=${sessionId}`)
      .then(res => {
        if (!res.ok) throw new Error("Access link not found");
        return res.text();
      })
      .then(() => {
        // backend will redirect automatically
      })
      .catch(() => {
        document.body.innerHTML =
          "<p>Your payment was successful.<br>You will receive your access link shortly.</p>";
      });
  </script>
</body>
</html>
