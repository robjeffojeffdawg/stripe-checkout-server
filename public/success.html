<!DOCTYPE html>
<html>
<head>
  <title>Payment successful</title>
</head>
<body>
  <h1>✅ Payment successful</h1>
  <p>Your payment has been confirmed.</p>
  <p>We’re preparing your access now — you’ll be redirected automatically.</p>

 <script>
  const params = new URLSearchParams(window.location.search)
  const sessionId = params.get("session_id")

  if (!sessionId) {
    document.body.innerHTML = "❌ Missing session ID."
    throw new Error("No session_id in URL")
  }

  let attempts = 0
  const MAX_ATTEMPTS = 10

  async function fetchToken() {
    try {
      const res = await fetch(
        `/exchange-session-for-token?session_id=${sessionId}`
      )

      if (!res.ok) {
        throw new Error("Token not ready")
      }

      const data = await res.json()

      if (!data.token) {
        throw new Error("No token returned")
      }

      // ✅ SUCCESS → redirect using the token returned by backend
      window.location.href = `/access?token=${data.token}`

    } catch (err) {
      attempts++

      if (attempts >= MAX_ATTEMPTS) {
        document.body.innerHTML =
          "❌ Access not ready yet. Please refresh this page in a moment."
        return
      }

      // retry after 1 second
      setTimeout(fetchToken, 1000)
    }
  }

  fetchToken()
</script>

</body>
</html>
