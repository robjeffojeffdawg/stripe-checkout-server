<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Payment Successful</title>
</head>
<body>
  <h1>Thanks for your purchase 🎉</h1>
  <p>Redirecting you to your access…</p>

  <script>
    const params = new URLSearchParams(window.location.search);
    const sessionId = params.get("session_id");

    if (sessionId) {
      window.location.href = `/redirect-after-success?session_id=${sessionId}`;
    } else {
      document.body.innerHTML += "<p>Missing session information.</p>";
    }
  </script>
</body>
</html>
