<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Payment successful</title>
  </head>
  <body>
    <h2>Processing payment…</h2>
    
<script>
  const params = new URLSearchParams(window.location.search);
  const sessionId = params.get("session_id");

  if (!sessionId) {
    document.body.innerHTML = "<h2>Missing session ID</h2>";
    throw new Error("No session_id");
  }

  fetch(`/exchange-session-for-token?session_id=${sessionId}`)
    .then(res => res.json())
    .then(data => {
      if (!data.token) throw new Error("No token returned");
      window.location.href = `/access?token=${data.token}`;
    })
    .catch(err => {
      console.error(err);
      document.body.innerHTML = "<h2>Access error</h2>";
    });
</script>
   
  </body>
</html>
