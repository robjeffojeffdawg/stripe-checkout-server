<!DOCTYPE html>
<html>
<head>
  <title>Payment successful</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      text-align: center;
      padding-top: 60px;
    }

    .spinner {
      margin: 20px auto;
      width: 40px;
      height: 40px;
      border: 4px solid #ddd;
      border-top-color: #000;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>

<body>
  <h1>✅ Payment successful</h1>
  <p>Your payment has been confirmed.</p>
  <p id="status">
    We’re preparing your access now — you’ll be redirected automatically.
  </p>

  <div class="spinner"></div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const sessionId = params.get("session_id");

    if (!sessionId) {
      document.getElementById("status").innerText =
        "❌ Missing session ID. Please contact support.";
      throw new Error("No session_id in URL");
    }

    let attempts = 0;
    const MAX_ATTEMPTS = 15; // ~15 seconds total

    async function pollForToken() {
      try {
        const res = await fetch(
          `/exchange-session-for-token?session_id=${sessionId}`
        );

        if (!res.ok) throw new Error("Token not ready");

        const data = await res.json();

        if (!data.token) throw new Error("No token yet");

        // ✅ SUCCESS → redirect
        window.location.href = `/access?token=${data.token}`;

      } catch (err) {
        attempts++;
        console.log(`⏳ Waiting for access token (${attempts})`);

        if (attempts >= MAX_ATTEMPTS) {
          document.querySelector(".spinner").remove();
          document.getElementById("status").innerText =
            "❌ Access is still being prepared. Please refresh this page in a moment.";
          return;
        }

        setTimeout(pollForToken, 1000);
      }
    }

    pollForToken();
  </script>
</body>
</html>
