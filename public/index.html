<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Stripe Checkout</title>

  <!-- ✅ Stripe.js MUST be loaded first -->
  <script src="https://js.stripe.com/v3/"></script>
</head>

<body>
  <h1>Choose a product</h1>

  <!-- ✅ Buttons call the function properly -->
  <button onclick="pay('price_1SnDqgAG2360Iu0shfbuWDo0')">
    Buy Basic
  </button>

  <br /><br />

  <button onclick="pay('price_1SnDrVAG2360Iu0sv0Rxl7QQ')">
    Buy Premium
  </button>

  <!-- ✅ Stripe initialized AFTER Stripe.js -->
  <script>
    const stripe = Stripe(
      "pk_test_51HJeiVAG2360Iu0sR7j4nGRCh5X7EkXFzmuPw2REopZ4TXuFnl5JL984bfNK9gWlIoWp79nta3rmvPny2HUR55Ui00FL0fyUJG"
    );

    async function pay(priceId) {
      try {
        const res = await fetch("/create-checkout-session", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ priceId }),
        });

        const data = await res.json();

        if (data.url) {
          window.location.href = data.url;
        } else {
          alert(data.error || "Session failed");
        }
      } catch (err) {
        console.error(err);
        alert("Network error");
      }
    }
  </script>
</body>
</html>
