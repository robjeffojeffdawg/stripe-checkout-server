<body>

 <button onclick="pay('price_1SokWfAG2360Iu0s5hr6g5JH')">

<button onclick="pay('price_1SokXdAG2360Iu0s7lZJWy3z')">

  <script>
    const stripe = Stripe(
      "pk_test_51HJeiVAG2360Iu0sR7j4nGRCh5X7EkXFzmuPw2REopZ4TXuFnl5JL984bfNK9gWlIoWp79nta3rmvPny2HUR55Ui00FL0fyUJG"

    async function pay(priceId) {
      try {
    const res = await fetch(
      "https://stripe-checkout-server-4w4i.onrender.com/create-checkout-session",
      {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ priceId }),
      }
    );

    const data = await res.json();

    if (data.url) {
          window.location.href = data.url;
        } else {
          alert(data.error);
        }
      } catch (err) {
        console.error(err);
        alert("Network error");
      }
    }
  </script>
