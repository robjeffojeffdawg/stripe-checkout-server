<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Stripe Checkout</title>
</head>
<body>
  <h1>Choose a plan</h1>

  <button id="buy-basic">Buy Basic</button>
  <br /><br />
  <button id="buy-premium">Buy Premium</button>

  <script>
    async function checkout(priceId) {
      try {
        const res = await fetch("/create-price-checkout-session", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ priceId }),
        });

        const data = await res.json();

        if (data.url) {
          window.location.href = data.url;
        } else {
          alert(data.error || "Checkout failed");
        }
      } catch (err) {
        alert("Network error");
        console.error(err);
      }
    }

    document.getElementById("buy-basic").addEventListener("click", () => {
      checkout("price_1SnDPfAG2360Iu0sB08qRFKW");
    });

    document.getElementById("buy-premium").addEventListener("click", () => {
      checkout("price_1SnDPxAG2360Iu0sTUXRZpOv");
    });
  </script>
</body>
</html>
