<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Member Access</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background: #020617;
      padding: 40px;
      border-radius: 12px;
      max-width: 500px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }
    h1 {
      margin-bottom: 10px;
      font-size: 28px;
    }
    p {
      font-size: 16px;
      opacity: 0.9;
    }
    .badge {
      margin-top: 20px;
      display: inline-block;
      padding: 8px 14px;
      background: #22c55e;
      color: #052e16;
      border-radius: 999px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>✅ Access Granted</h1>
    <p>Welcome — your purchase has been confirmed.</p>
    <p>You now have full access to the product.</p>
    <div class="badge">Active Access</div>
  </div>
</body>
</html>
