<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Your Purchase</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f172a;
      color: #e5e7eb;
      margin: 0;
      padding: 0;
    }

    .container {
      max-width: 720px;
      margin: 80px auto;
      padding: 40px;
      background: #020617;
      border-radius: 12px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }

    h1 {
      margin-top: 0;
      font-size: 32px;
    }

    p {
      line-height: 1.6;
      color: #cbd5f5;
    }

    .download {
      display: inline-block;
      margin-top: 30px;
      padding: 14px 24px;
      background: #22c55e;
      color: #052e16;
      font-weight: 600;
      text-decoration: none;
      border-radius: 8px;
    }

    .hint {
      margin-top: 20px;
      font-size: 14px;
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Welcome 👋</h1>

      <p>This is your purchased content.</p>

  <a id="download">⬇️ Download Premium Package</a>

    </a>

    <div class="hint">
      Tip: Bookmark this page — it’s your permanent access link.
    </div>
  </div>

  <script>
      const params = new URLSearchParams(window.location.search);
  const token = params.get("token");

  if (!token) {
    document.body.innerHTML = "<h2>❌ Missing access token</h2>";
    throw new Error("No token");
  }

  document.getElementById("download").href =
    `/download?file=premium.zip&token=${token}`;
  </script>
</body>
</html>
