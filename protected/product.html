<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Your Premium Package</title>
</head>
    
<body>
  <h1>🎉 Your Premium Package Is Ready</h1>

  <p>Thank you for your purchase.</p>
    <p>You now have access to your premium digital package.</p>

    <p style="color:#555;">
  ⏳ Your access link is valid for a limited time. Please download your files now.
</p>

<a
  id="download-link"
  href="#"
  style="display:inline-block; margin-top:16px;"
>

<a id="download-link">⬇️ Download Premium Package</a>

  <p>This is a one-time purchase. No subscription or recurring charges.</p>
  </p>

<script>
    const params = new URLSearchParams(window.location.search)
    const token = params.get("token")

    if (!token) {
      document.body.innerHTML = "❌ Invalid or missing access token."
      throw new Error("Missing token on product page")
    }

    const downloadLink = document.getElementById("download-link")
    downloadLink.href = `/download?file=premium.zip&token=${token}`
  </script>
</body>
</html>
